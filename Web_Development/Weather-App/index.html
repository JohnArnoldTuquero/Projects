<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Weather App</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="style.css" rel="stylesheet">
    </head>
    <body>

        <div class="card">
            <div class="search">
                <input type="text" placeholder="Search" spellcheck="false" name="" id="">
                <button><img src="assets/search-removebg.png" alt="Search Button"></button>
            </div>

            <div class="weather">
                <img src="assets/rain-removebg.png" alt="rain" class="weather-icon">
                <h1 class="temp">22°c</h1>
                <h2 class="city">Pasig</h2>

                <div class="details">
                    <div class="col">
                        <img src="assets/humidity-removebg.png" alt="">

                        <div>
                            <p class="humidity">50%</p>
                            <p>Humidity</p>
                        </div>
                    </div>

                    <div class="col">
                        <img src="assets/wind-removebg.png" alt="">

                        <div>
                            <p class="wind">67 km/hr</p>
                            <p>Wind</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    
    </body>
</html>
